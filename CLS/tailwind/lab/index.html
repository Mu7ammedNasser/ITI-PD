<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>portfolio</title>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <nav class="navbar fixed bg-white px-30 justify-between shadow-sm">
      <div class="navbar-start">
        <a class="text-2xl font-bold text-violet-600">Portfolio</a>
      </div>
      <div class="navbar-end justify-end hidden lg:flex">
        <ul class="menu menu-horizontal">
          <li class="p-3 font-bold">Home</li>
          <li class="p-3 font-bold">About</li>
          <li class="p-3 font-bold">Projects</li>
          <li class="p-3 font-bold">Contact</li>
        </ul>
      </div>
      <div class="navbar-end lg:hidden">
        <div class="dropdown">
          <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h8m-8 6h16"
              />
            </svg>
          </div>
          <ul
            tabindex="-1"
            class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow absolute right-0"
          >
            <li class="font-bold">Home</li>
            <li class="font-bold">About</li>
            <li class="font-bold">Projects</li>
            <li class="font-bold">Contact</li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="landing h-screen bg-violet-600 grid grid-cols-1 lg:grid-cols-5 items-center p-10 lg:p-20 text-white">
        <div class="landing-info col-span-2">
            <h1 class="text-5xl font-bold mb-5">Build Modern UI Experiences</h1>
            <p class="text-lg mb-5">Creating modern UI experiences with cutting-edge technologies.</p>
            <button class="bg-violet-600 text-white px-6 py-3 rounded-lg border-solid border-white border hover:bg-white hover:text-violet-600 transition-all">Get Started</button>
            <button class="bg-white text-violet-600 px-6 py-3 rounded-lg border-solid border-white border hover:bg-violet-700 hover:text-white transition-all ml-3">Contact Me</button>
        </div>
        <div class="landing-image col-span-3 flex justify-center">
            <img src="./landing.jpeg" alt="Modern UI Illustration" class="rounded-lg shadow-lg"/>
        </div>
    </div>
    
  </body>
</html>
